name: Source health

# Once a week, downloads every source in source_catalog.json the way the app does and checks that
# it still parses and has recent entries (tools/check_sources.py). A broken source opens an issue
# (and updates it on later runs); when everything is healthy again the issue is closed.
# Run it by hand from the Actions tab at any time. Some sites answer data-centre addresses
# differently from phones, so a failure here is a prompt to look, not proof the app is broken.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every source
        id: check
        continue-on-error: true
        run: python3 tools/check_sources.py --report report.md
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Source health check failed"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ "${{ steps.check.outcome }}" = "failure" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file report.md
            else
              gh issue create --title "$title" --body-file report.md
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "All sources are healthy again."
            gh issue close "$number"
          fi
      - name: Fail the run when a source is broken
        if: steps.check.outcome == 'failure'
        run: exit 1
